version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-healthgrid}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/healthgrid?schema=public}
      - JWT_SECRET=${JWT_SECRET:-hackathon_secret_123}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ai-service:8000}
      - PORT=${PORT:-5000}
    depends_on:
      - db
      - ai-service

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/models:/app/models

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
