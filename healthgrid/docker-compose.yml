services:
  db:
    image: postgres:15-alpine
    container_name: healthgrid_db
    environment:
      POSTGRES_USER: healthgrid
      POSTGRES_PASSWORD: healthgrid_password
      POSTGRES_DB: healthgrid
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
